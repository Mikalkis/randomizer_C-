# Сборка проекта на Windows и выкладка rand.exe как артефакта.
# Программа использует WinAPI, поэтому Linux-сборки не нужны.
name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build --config Release

    - name: Upload exe
      uses: actions/upload-artifact@v4
      with:
        name: rand-windows-x64
        path: build/Release/rand.exe
